<!-- Общее модальное окно с сообщением об ошибке -->

  <header>
    <h3 id="js-error-message-title">Не удалось выполнить действие</h3>
  </header>
  <main>
    <p id="js-error-message">Попробуйте повторить попытку позже</p>

  </footer>
</div>
