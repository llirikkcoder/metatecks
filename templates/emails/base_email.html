<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Метатэкс{% endblock %}</title>
</head>
<body style="margin:0; padding:0; background-color:#f2efe9; font-family:Arial, Helvetica, sans-serif; color:#2b2b2b;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f2efe9; padding:24px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="background-color:#ffffff; border-radius:8px; overflow:hidden;">
          <tr>
            <td style="background-color:#2b2b2b; padding:20px 32px;">
              <span style="color:#ffffff; font-size:20px; font-weight:bold;">МЕТАТЭКС</span>
            </td>
          </tr>
          <tr>
            <td style="padding:32px;">
              {% block content %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td style="padding:16px 32px; background-color:#f7f5f1; font-size:12px; color:#8a8a8a;">
              Это автоматическое письмо, отвечать на него не нужно. По вопросам — info@metateks.ru, +7 800 222-54-32.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
