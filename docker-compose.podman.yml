# Development окружение для Podman с hot-reload
# Запуск: podman-compose -f docker-compose.yml -f docker-compose.podman.yml up

services:
  # База данных PostgreSQL (без изменений)
  db:
    ports:
      - "5432:5432"

  # Redis для Celery (без изменений)
  redis:
    ports:
      - "6379:6379"

  # Django приложение (Development режим с hot-reload)
  web:
    ports:
      - "9000:8000"
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
      - static_volume:/app/static
      - ./media:/app/media
      - ./logs:/app/logs
      - /app/__pycache__
      - /app/.venv
    environment:
      - DJANGO_DEBUG=True
      - DJANGO_SETTINGS_MODULE=main.settings
    healthcheck:
      disable: true

  # Celery Worker (Development режим)
  celery:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:/app
      - ./media:/app/media
      - ./logs:/app/logs
      - /app/__pycache__
      - /app/.venv
    environment:
      - DJANGO_DEBUG=True
      - CELERY_LOG_LEVEL=debug

  # Nginx (Development)
  nginx:
    depends_on:
      web:
        condition: service_started
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - static_volume:/app/static:ro
      - ./media:/app/media:ro
      - ./assets:/app/assets:ro
    ports:
      - "80:80"

volumes:
  static_volume:
    name: metateks_static_volume

networks:
  metateks_network:
    driver: bridge
