name: Deploy to VPS

# Запускать при push в ветку main
on:
  push:
    branches:
      - main

concurrency:
  group: metateks-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest
    timeout-minutes: 85

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate deployment safety checks
        run: |
          bash -n scripts/deploy.sh
          python3 scripts/test_celery_deploy_guard.py
          python3 scripts/test_deploy.py

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 75m
          script: |
            set -euo pipefail
            cd /opt/metatecks
            exec 9>/run/lock/metateks-deploy.lock
            if ! flock -n 9; then
              echo "Another deployment holds the server lock"
              exit 1
            fi
            if ! git diff --quiet HEAD; then
              git status --short --untracked-files=no
              echo "Uncommitted server changes; deployment blocked"
              exit 1
            fi
            git fetch origin main
            git merge --ff-only ${{ github.sha }}
            test "$(git rev-parse HEAD)" = "${{ github.sha }}"
            bash scripts/deploy.sh

      - name: Deployment notification
        if: always()
        run: |
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ Deployment to VPS successful!"
          else
            echo "❌ Deployment to VPS failed!"
          fi
