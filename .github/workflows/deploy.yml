name: Deploy to VPS

# Запускать при push в ветку main
on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          # Сборка и ожидание обмена с 1С не укладываются в 10 минут по умолчанию
          command_timeout: 60m
          script: |
            # Любая ошибка останавливает деплой, а не тихо идёт дальше
            set -euo pipefail
            echo "🚀 Starting deployment..."
            cd /opt/metatecks

            # Правки, внесённые прямо на сервере, git pull не перезапишет.
            # Раньше деплой молча шёл дальше и собирал старый код.
            if ! git diff --quiet HEAD; then
              echo "❌ На сервере незакоммиченные правки, деплой остановлен:"
              git status --short --untracked-files=no
              exit 1
            fi

            echo "⬇️ Pulling latest changes..."
            git fetch origin main
            git merge --ff-only origin/main
            echo "✅ Latest commit: $(git log -1 --oneline)"

            # Сборка идёт, пока работают старые контейнеры: сайт в это время доступен.
            # Без --no-cache слой с зависимостями берётся из кеша, если requirements не менялись.
            echo "🔨 Building Docker images..."
            docker compose build

            # Перезапуск celery обрывает обмен с 1С. Ждём, пока воркер освободится, до 40 минут.
            echo "⏳ Checking celery for running 1C exchange..."
            for i in $(seq 1 40); do
              active=$(docker compose exec -T celery celery -A main inspect active -t 5 2>/dev/null || true)
              if ! grep -q "'name':" <<< "$active"; then
                break
              fi
              if [ "$i" = 40 ]; then
                echo "❌ Celery занят больше 40 минут, деплой остановлен. Перезапустите job позже."
                exit 1
              fi
              echo "   celery занят (обмен с 1С), жду минуту... ($i/40)"
              sleep 60
            done

            # migrate и collectstatic выполняет entrypoint web при старте
            echo "🔄 Restarting containers..."
            docker compose up -d

            echo "🩺 Waiting for web..."
            for i in $(seq 1 30); do
              curl -fs -o /dev/null http://127.0.0.1:8001/health/ && break
              if [ "$i" = 30 ]; then
                echo "❌ web не поднялся за 5 минут"
                docker compose logs --tail=50 web
                exit 1
              fi
              sleep 10
            done
            # nginx запоминает IP старого контейнера web
            docker compose restart nginx

            # Старый образ после пересборки остаётся без тега. Диск на сервере всего 30 ГБ.
            # Кеш сборки не трогаем, его раз в неделю чистит cron (docker system prune -a).
            echo "🧹 Cleaning up old Docker images..."
            docker image prune -f

            echo "📊 Container status:"
            docker compose ps
            echo "✅ Deployment completed successfully!"

      - name: Deployment notification
        if: always()
        run: |
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ Deployment to VPS successful!"
          else
            echo "❌ Deployment to VPS failed!"
          fi
