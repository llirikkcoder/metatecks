name: Deploy to VPS

# Запускать при push в ветку main
on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            echo "🚀 Starting deployment..."

            # Перейти в директорию проекта
            cd /opt/metatecks

            # Проверить текущую ветку
            echo "📌 Current branch: $(git branch --show-current)"

            # Подтянуть изменения
            echo "⬇️ Pulling latest changes..."
            git pull origin main

            # Показать последний коммит
            echo "✅ Latest commit: $(git log -1 --oneline)"

            # Пересобрать Docker образы
            echo "🔨 Building Docker images..."
            docker-compose build --no-cache

            # Перезапустить контейнеры
            echo "🔄 Restarting containers..."
            docker-compose up -d

            # Выполнить миграции (если нужно)
            echo "🗄️ Running migrations..."
            docker-compose exec -T web python manage.py migrate --noinput

            # Собрать статику (если нужно)
            echo "📦 Collecting static files..."
            docker-compose exec -T web python manage.py collectstatic --noinput

            # Проверить статус контейнеров
            echo "📊 Container status:"
            docker-compose ps

            # Показать логи последних 20 строк
            echo "📝 Recent logs:"
            docker-compose logs --tail=20 web

            echo "✅ Deployment completed successfully!"

      - name: Deployment notification
        if: always()
        run: |
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ Deployment to VPS successful!"
          else
            echo "❌ Deployment to VPS failed!"
          fi
