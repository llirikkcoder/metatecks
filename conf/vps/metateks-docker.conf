# Конфигурация для Docker приложения на домене metateks-admin.vinodesign.ru
# Проксирует все запросы в Docker nginx на порту 8080

# HTTP редирект на HTTPS
server {
    listen 80;
    server_name metateks-admin.vinodesign.ru
                spb.metateks-admin.vinodesign.ru
                ekb.metateks-admin.vinodesign.ru
                nsk.metateks-admin.vinodesign.ru
                krasnodar.metateks-admin.vinodesign.ru
                yaroslavl.metateks-admin.vinodesign.ru
                murmansk.metateks-admin.vinodesign.ru;

    return 301 https://$host$request_uri;
}

# HTTPS основной сервер
server {
    listen 443 ssl;

    # SSL сертификаты
    ssl_certificate /etc/letsencrypt/live/metateks-admin.vinodesign.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/metateks-admin.vinodesign.ru/privkey.pem;

    # Домены
    server_name metateks-admin.vinodesign.ru
                spb.metateks-admin.vinodesign.ru
                ekb.metateks-admin.vinodesign.ru
                nsk.metateks-admin.vinodesign.ru
                krasnodar.metateks-admin.vinodesign.ru
                yaroslavl.metateks-admin.vinodesign.ru
                murmansk.metateks-admin.vinodesign.ru;

    charset utf-8;
    client_max_body_size 100M;
    client_body_buffer_size 50M;

    # Логи
    access_log /var/log/nginx/metateks-docker_access.log;
    error_log /var/log/nginx/metateks-docker_error.log;

    # Проксирование ВСЕХ запросов в Docker nginx
    # Docker nginx сам обслуживает /static/ и /media/
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Таймауты
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Буферизация
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;

        # Отключить редиректы
        proxy_redirect off;
    }
}
