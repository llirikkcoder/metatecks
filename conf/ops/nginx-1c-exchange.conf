# Обмен с 1С в системном nginx: /etc/nginx/sites-available/metateks-docker.conf
#
# Блок добавляется ПЕРЕД `location /` в server-секцию боевого домена.
#
# Зачем: полная выгрузка каталога из 1С весит около 186 МБ, а общий лимит
# в конфиге — client_max_body_size 100M, таймауты 60s. Из-за этого 1С получала
# 413 (Request Entity Too Large) на загрузке import0_1.xml и обмен не начинался:
# запросы даже не доходили до Django, поэтому в журнале обмена было пусто.
# Обнаружено 16.09.2026 по логам /var/log/nginx/metateks-docker_access.log.
#
# Внутри Docker аналогичный location уже есть (docker/nginx/conf.d/default.conf),
# но он бесполезен, пока запрос режет внешний nginx.
#
# После правки: nginx -t && systemctl reload nginx
# Проверка: загрузка тела больше 100 МБ должна давать 401 (спрашивает авторизацию),
# а не 413:
#   head -c 150000000 /dev/zero > /tmp/big && \
#   curl -o /dev/null -w '%{http_code}\n' -X POST --data-binary @/tmp/big \
#     'https://<домен>/cml/exchange?type=catalog&mode=file&filename=import_test.xml'

    # Обмен с 1С (CommerceML): полная выгрузка каталога весит ~186 МБ,
    # общий лимит 100M и таймаут 60s её не пропускают — отсюда 413 у 1С.
    location ~* ^/(cml/)?(1c_exchange\.php|exchange) {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        client_max_body_size 500M;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }
