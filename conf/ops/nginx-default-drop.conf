# Обрывать запросы с чужим Host (metateks.vlch.dev и любые другие домены,
# наведённые на этот IP). Сайт обслуживают только имена из metateks-docker.conf.
# 24.08.2026, при отвязке metateks.vlch.dev.

server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    server_name _;
    # Отклонять TLS-хендшейк, если SNI не совпал ни с одним server_name:
    # ни сертификат, ни содержимое сайта чужому домену не отдаются.
    ssl_reject_handshake on;
}
